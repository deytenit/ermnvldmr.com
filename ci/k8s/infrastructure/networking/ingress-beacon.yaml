apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beacon-ingress
  namespace: com-ermnvldmr
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: com-ermnvldmr-strip-beacon@kubernetescrd
    traefik.ingress.kubernetes.io/router.priority: "100"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - www.ermnvldmr.com
      secretName: ermnvldmr-tls
    - hosts:
        - docs.ermnvldmr.com
      secretName: docs-ermnvldmr-tls
  rules:
    - host: www.ermnvldmr.com
      http:
        paths:
          - path: /beacon
            pathType: Prefix
            backend:
              service:
                name: umami-service
                port:
                  number: 3000
    - host: docs.ermnvldmr.com
      http:
        paths:
          - path: /beacon
            pathType: Prefix
            backend:
              service:
                name: umami-service
                port:
                  number: 3000
