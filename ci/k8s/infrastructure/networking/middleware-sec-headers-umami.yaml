apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: sec-headers-umami
  namespace: com-ermnvldmr
spec:
  headers:
    contentSecurityPolicy: "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests;"
    customResponseHeaders:
      Content-Security-Policy-Report-Only: "require-trusted-types-for 'script'; trusted-types default;"
