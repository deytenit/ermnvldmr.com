apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exp-ingress
  namespace: com-ermnvldmr
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: com-ermnvldmr-sec-headers-common@kubernetescrd,com-ermnvldmr-sec-headers-exp@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - exp.ermnvldmr.com
      secretName: exp-ermnvldmr-tls
  rules:
    - host: exp.ermnvldmr.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: exp-service
                port:
                  number: 80
