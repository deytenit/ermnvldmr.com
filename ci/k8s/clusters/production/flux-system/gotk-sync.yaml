apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ermnvldmr-repo
  namespace: flux-system
spec:
  interval: 1m
  url: https://github.com/deytenit/ermnvldmr.com.git
  ref:
    branch: next
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-sync
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: com-ermnvldmr
  sourceRef:
    kind: GitRepository
    name: ermnvldmr-repo
  path: ./ci/k8s/clusters/production
  prune: true
  wait: true
  timeout: 3m
  decryption:
    provider: sops
    secretRef:
      name: sops-age
