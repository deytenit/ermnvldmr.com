baseURL: 'https://docs.ermnvldmr.com'
defaultContentLanguage: 'en'
defaultContentLanguageInSubdir: true
title: 'ermnvldmr.com'
description: 'Documentation for ermnvldmr.com services and infrastructure'

# Multilingual configuration
languages:
  en:
    languageCode: 'en-us'
    languageName: 'English'
    title: 'ermnvldmr.com'
    description: 'Documentation for ermnvldmr.com services and infrastructure'
    weight: 1
    contentDir: 'content/en'
    menu:
      main:
        - name: Search
          weight: 50
          params:
            type: search
  ru:
    languageCode: 'ru'
    languageName: 'Русский'
    title: 'ermnvldmr.com'
    description: 'Документация для сервисов и инфраструктуры ermnvldmr.com'
    weight: 2
    contentDir: 'content/ru'
    menu:
      main:
        - name: Search
          weight: 50
          params:
            type: search

# Theme configuration
theme: hextra

enableGitInfo: true

# Hextra theme parameters
params:
  Author:
    name: Vladimir Eremin
    email: personal@ermnvldmr.com
  description: 'Documentation for ermnvldmr.com services and infrastructure'

  # Analytics configuration
  analytics:
    umami:
      serverURL: 'https://umami.ermnvldmr.com'
      websiteID: 'fbdadf3f-3484-4186-a2c2-cedcf76cf44f'
      domains: 'docs.ermnvldmr.com'
      doNotTrack: 'true'

  # Search configuration
  search:
    enable: true
    type: flexsearch
    flexsearch:
      # index page by: content | summary | heading | title
      index: content
      # full | forward | reverse | strict
      # https://github.com/nextapps-de/flexsearch/#tokenizer-prefix-search
      tokenize: forward

  displayUpdatedDate: true
  dateFormat: 'January 2, 2006'

  # Navigation configuration
  navbar:
    displayTitle: true
    width: wide
    displayLogo: false

  # Footer configuration
  footer:
    displayCopyright: true
    displayPoweredBy: true

  # Edit page configuration
  editURL:
    enable: true
    base: 'https://github.com/deytenit/ermnvldmr.com/edit/next/services/docs/content'

  page:
    width: wide

  theme:
    default: system
    displayToggle: true

# Markdown configuration
markup:
  highlight:
    style: github
    lineNos: true
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

# Output formats
outputs:
  home: [HTML]
  page: [HTML]
  section: [HTML]

# Deployment configuration
deployment:
  targets:
    - name: production
      URL: docs.ermnvldmr.com
      cloudFrontDistributionID: # TBD during deployment
