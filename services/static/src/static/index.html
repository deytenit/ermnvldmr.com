<!doctype html>
<html lang="en">
  <head>
    <script>
      (function () {
        try {
          var k = 'ermnvldmr/ui/lib/theme';
          var p = JSON.parse(localStorage.getItem(k) || '"system"');
          var d =
            p === 'dark' ||
            (p === 'system' && window.matchMedia('(prefers-color-scheme:dark)').matches);
          document.documentElement.classList.toggle('dark', d);
        } catch (e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vladimir Eremin</title>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
