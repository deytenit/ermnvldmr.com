name: 'push(packages/kits): CI Checks'
'on':
  push:
    branches:
    - next
    paths:
    - packages/kits/**
    - packages/ui/**
    - packages/stl/**
    - packages/i18n/**
    - .gitea/workflows/push-packages-kits-ci-checks.yml
    - pnpm-lock.yaml
    - ci/scripts/**
concurrency:
  group: ci-next-kits-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  setup-stage:
    name: Setup - Stage
    runs-on: apex-debian13
    outputs: {}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup environment
      run: bash ci/scripts/setup-env.sh 9.12.3 20
    - name: Restore repository dependency cache
      id: dependency-cache
      run: python3 ci/scripts/cache.py restore
      env:
        CACHE_TOKEN: ${{ github.token }}
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Pack dependency cache
      run: python3 ci/scripts/cache.py pack
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.dependency-cache.outputs.key }}
        path: .ci/pnpm-store.tar
        retention-days: 7
  build-configs:
    name: Build - Configs & UI
    needs: setup-stage
    runs-on: apex-debian13
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup environment
      run: bash ci/scripts/setup-env.sh 9.12.3 20
    - name: Restore repository dependency cache
      id: dependency-cache
      run: python3 ci/scripts/cache.py restore
      env:
        CACHE_TOKEN: ${{ github.token }}
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Build Rsbuild config
      run: pnpm --filter @ermnvldmr/rsbuild-config build
    - name: Build Storybook config
      run: pnpm --filter @ermnvldmr/storybook-config build
    - name: Build i18n
      run: pnpm --filter @ermnvldmr/i18n build
    - name: Build UI
      run: pnpm --filter @ermnvldmr/ui build
    - name: Upload Rsbuild Config
      uses: actions/upload-artifact@v4
      with:
        name: rsbuild-config-dist-${{ github.run_id }}
        path: packages/rsbuild-config/dist
        retention-days: 30
    - name: Upload Storybook Config
      uses: actions/upload-artifact@v4
      with:
        name: storybook-config-dist-${{ github.run_id }}
        path: packages/storybook-config/dist
        retention-days: 30
    - name: Upload i18n dist
      uses: actions/upload-artifact@v4
      with:
        name: i18n-dist-${{ github.run_id }}
        path: packages/i18n/dist
        retention-days: 30
    - name: Upload UI dist
      uses: actions/upload-artifact@v4
      with:
        name: ui-dist-${{ github.run_id }}
        path: packages/ui/dist
        retention-days: 30
  lint-kits:
    name: Lint - Kits
    needs: build-configs
    runs-on: apex-debian13
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup environment
      run: bash ci/scripts/setup-env.sh 9.12.3 20
    - name: Restore repository dependency cache
      id: dependency-cache
      run: python3 ci/scripts/cache.py restore
      env:
        CACHE_TOKEN: ${{ github.token }}
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Download Rsbuild Config
      uses: actions/download-artifact@v4
      with:
        name: rsbuild-config-dist-${{ github.run_id }}
        path: packages/rsbuild-config/dist
    - name: Download Storybook Config
      uses: actions/download-artifact@v4
      with:
        name: storybook-config-dist-${{ github.run_id }}
        path: packages/storybook-config/dist
    - name: Download i18n dist
      uses: actions/download-artifact@v4
      with:
        name: i18n-dist-${{ github.run_id }}
        path: packages/i18n/dist
    - name: Download UI dist
      uses: actions/download-artifact@v4
      with:
        name: ui-dist-${{ github.run_id }}
        path: packages/ui/dist
    - name: Lint Kits package
      run: pnpm --filter @ermnvldmr/kits lint
  typecheck-kits:
    name: Typecheck - Kits
    needs: build-configs
    runs-on: apex-debian13
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup environment
      run: bash ci/scripts/setup-env.sh 9.12.3 20
    - name: Restore repository dependency cache
      id: dependency-cache
      run: python3 ci/scripts/cache.py restore
      env:
        CACHE_TOKEN: ${{ github.token }}
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Download Rsbuild Config
      uses: actions/download-artifact@v4
      with:
        name: rsbuild-config-dist-${{ github.run_id }}
        path: packages/rsbuild-config/dist
    - name: Download Storybook Config
      uses: actions/download-artifact@v4
      with:
        name: storybook-config-dist-${{ github.run_id }}
        path: packages/storybook-config/dist
    - name: Download i18n dist
      uses: actions/download-artifact@v4
      with:
        name: i18n-dist-${{ github.run_id }}
        path: packages/i18n/dist
    - name: Download UI dist
      uses: actions/download-artifact@v4
      with:
        name: ui-dist-${{ github.run_id }}
        path: packages/ui/dist
    - name: Typecheck Kits package
      run: pnpm --filter @ermnvldmr/kits typecheck
  test-kits:
    name: Test - Unit
    needs: build-configs
    runs-on: apex-debian13
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup environment
      run: bash ci/scripts/setup-env.sh 9.12.3 20
    - name: Restore repository dependency cache
      id: dependency-cache
      run: python3 ci/scripts/cache.py restore
      env:
        CACHE_TOKEN: ${{ github.token }}
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Download Rsbuild Config
      uses: actions/download-artifact@v4
      with:
        name: rsbuild-config-dist-${{ github.run_id }}
        path: packages/rsbuild-config/dist
    - name: Download Storybook Config
      uses: actions/download-artifact@v4
      with:
        name: storybook-config-dist-${{ github.run_id }}
        path: packages/storybook-config/dist
    - name: Download i18n dist
      uses: actions/download-artifact@v4
      with:
        name: i18n-dist-${{ github.run_id }}
        path: packages/i18n/dist
    - name: Download UI dist
      uses: actions/download-artifact@v4
      with:
        name: ui-dist-${{ github.run_id }}
        path: packages/ui/dist
    - name: Test Kits package
      run: pnpm --filter @ermnvldmr/kits test:coverage
  build-storybook:
    name: Build - Storybook
    needs: build-configs
    runs-on: apex-debian13
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup environment
      run: bash ci/scripts/setup-env.sh 9.12.3 20
    - name: Restore repository dependency cache
      id: dependency-cache
      run: python3 ci/scripts/cache.py restore
      env:
        CACHE_TOKEN: ${{ github.token }}
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Download Rsbuild Config
      uses: actions/download-artifact@v4
      with:
        name: rsbuild-config-dist-${{ github.run_id }}
        path: packages/rsbuild-config/dist
    - name: Download Storybook Config
      uses: actions/download-artifact@v4
      with:
        name: storybook-config-dist-${{ github.run_id }}
        path: packages/storybook-config/dist
    - name: Download i18n dist
      uses: actions/download-artifact@v4
      with:
        name: i18n-dist-${{ github.run_id }}
        path: packages/i18n/dist
    - name: Download UI dist
      uses: actions/download-artifact@v4
      with:
        name: ui-dist-${{ github.run_id }}
        path: packages/ui/dist
    - name: Build Kits Storybook
      run: pnpm --filter @ermnvldmr/kits build-storybook
    - name: Upload Storybook build
      uses: actions/upload-artifact@v4
      with:
        name: kits-storybook-static-${{ github.run_id }}
        path: packages/kits/storybook-static/
        retention-days: 30
  test-storybook:
    name: Test - Storybook
    needs: build-storybook
    runs-on: apex-debian13
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup environment
      run: bash ci/scripts/setup-env.sh 9.12.3 20
    - name: Restore repository dependency cache
      id: dependency-cache
      run: python3 ci/scripts/cache.py restore
      env:
        CACHE_TOKEN: ${{ github.token }}
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Download Rsbuild Config
      uses: actions/download-artifact@v4
      with:
        name: rsbuild-config-dist-${{ github.run_id }}
        path: packages/rsbuild-config/dist
    - name: Download Storybook Config
      uses: actions/download-artifact@v4
      with:
        name: storybook-config-dist-${{ github.run_id }}
        path: packages/storybook-config/dist
    - name: Download i18n dist
      uses: actions/download-artifact@v4
      with:
        name: i18n-dist-${{ github.run_id }}
        path: packages/i18n/dist
    - name: Download UI dist
      uses: actions/download-artifact@v4
      with:
        name: ui-dist-${{ github.run_id }}
        path: packages/ui/dist
    - name: Install Playwright browsers
      run: |
        flock -w 300 /var/lib/gitea-runner/.playwright.lock bash -c '
          for attempt in 1 2 3 4 5; do
            pnpm --filter @ermnvldmr/kits exec playwright install --with-deps chromium && exit 0
            sleep 5
          done
          exit 1
        '
    - name: Download Storybook build
      uses: actions/download-artifact@v4
      with:
        name: kits-storybook-static-${{ github.run_id }}
        path: packages/kits/storybook-static/
    - name: Test Storybook
      run: pnpm --filter @ermnvldmr/kits test:storybook:ci
  build-kits:
    name: Build - Kits
    needs: build-configs
    runs-on: apex-debian13
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup environment
      run: bash ci/scripts/setup-env.sh 9.12.3 20
    - name: Restore repository dependency cache
      id: dependency-cache
      run: python3 ci/scripts/cache.py restore
      env:
        CACHE_TOKEN: ${{ github.token }}
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Download Rsbuild Config
      uses: actions/download-artifact@v4
      with:
        name: rsbuild-config-dist-${{ github.run_id }}
        path: packages/rsbuild-config/dist
    - name: Download Storybook Config
      uses: actions/download-artifact@v4
      with:
        name: storybook-config-dist-${{ github.run_id }}
        path: packages/storybook-config/dist
    - name: Download i18n dist
      uses: actions/download-artifact@v4
      with:
        name: i18n-dist-${{ github.run_id }}
        path: packages/i18n/dist
    - name: Download UI dist
      uses: actions/download-artifact@v4
      with:
        name: ui-dist-${{ github.run_id }}
        path: packages/ui/dist
    - name: Build Kits package
      run: pnpm --filter @ermnvldmr/kits build
