name: services/docs - pr/required
'on':
  pull_request:
    branches:
    - next
    paths:
    - services/docs/**
    - .gitea/workflows/services-docs-pr-required.yml
    - ci/scripts/**
concurrency:
  group: ci-pr-docs-${{ github.head_ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  setup-hugo:
    name: Setup - Hugo
    runs-on: apex-debian13
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup Hugo
      run: hugo version | grep extended
  build-hugo:
    name: Build - Hugo Site
    needs: setup-hugo
    runs-on: apex-debian13
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup Hugo
      run: hugo version | grep extended
    - name: Build Hugo site
      working-directory: services/docs
      run: hugo --gc --minify
