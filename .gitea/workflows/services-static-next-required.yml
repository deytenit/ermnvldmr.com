name: services/static - next/required
'on':
  push:
    branches:
    - next
    paths:
    - services/static/**
    - packages/ui/**
    - packages/stl/**
    - packages/i18n/**
    - .gitea/workflows/services-static-next-required.yml
    - ci/scripts/**
    - pnpm-lock.yaml
    - ci/scripts/**
concurrency:
  group: ci-static-${{ github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  setup-stage:
    name: Setup - Stage
    runs-on: apex-debian13
    outputs: {}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup environment
      run: bash ci/scripts/setup-env.sh 9.12.3 20
    - name: Restore repository dependency cache
      id: dependency-cache
      run: python3 ci/scripts/cache.py restore
      env:
        CACHE_TOKEN: ${{ github.token }}
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Pack dependency cache
      run: python3 ci/scripts/cache.py pack
    - uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.dependency-cache.outputs.key }}
        path: .ci/pnpm-store.tar
        retention-days: 7
  build-configs:
    name: Build - Configs
    needs: setup-stage
    runs-on: apex-debian13
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup environment
      run: bash ci/scripts/setup-env.sh 9.12.3 20
    - name: Restore repository dependency cache
      id: dependency-cache
      run: python3 ci/scripts/cache.py restore
      env:
        CACHE_TOKEN: ${{ github.token }}
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Build Rsbuild config
      run: pnpm --filter @ermnvldmr/rsbuild-config build
    - name: Build i18n
      run: pnpm --filter @ermnvldmr/i18n build
    - name: Upload Config Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: rsbuild-config-dist
        path: packages/rsbuild-config/dist
        retention-days: 30
    - name: Upload i18n dist
      uses: actions/upload-artifact@v4
      with:
        name: i18n-dist
        path: packages/i18n/dist
        retention-days: 30
  lint-static:
    name: Lint - Static
    needs: build-configs
    runs-on: apex-debian13
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup environment
      run: bash ci/scripts/setup-env.sh 9.12.3 20
    - name: Restore repository dependency cache
      id: dependency-cache
      run: python3 ci/scripts/cache.py restore
      env:
        CACHE_TOKEN: ${{ github.token }}
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Download Config Artifacts
      uses: actions/download-artifact@v4
      with:
        name: rsbuild-config-dist
        path: packages/rsbuild-config/dist
    - name: Download i18n dist
      uses: actions/download-artifact@v4
      with:
        name: i18n-dist
        path: packages/i18n/dist
    - name: Lint static service
      run: pnpm --filter @ermnvldmr/static lint
  typecheck-static:
    name: Typecheck - Static
    needs: build-configs
    runs-on: apex-debian13
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup environment
      run: bash ci/scripts/setup-env.sh 9.12.3 20
    - name: Restore repository dependency cache
      id: dependency-cache
      run: python3 ci/scripts/cache.py restore
      env:
        CACHE_TOKEN: ${{ github.token }}
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Download Config Artifacts
      uses: actions/download-artifact@v4
      with:
        name: rsbuild-config-dist
        path: packages/rsbuild-config/dist
    - name: Download i18n dist
      uses: actions/download-artifact@v4
      with:
        name: i18n-dist
        path: packages/i18n/dist
    - name: Typecheck static service
      run: pnpm --filter @ermnvldmr/static typecheck
  build-static:
    name: Build - Static Site
    needs: build-configs
    runs-on: apex-debian13
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup environment
      run: bash ci/scripts/setup-env.sh 9.12.3 20
    - name: Restore repository dependency cache
      id: dependency-cache
      run: python3 ci/scripts/cache.py restore
      env:
        CACHE_TOKEN: ${{ github.token }}
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
    - name: Download Config Artifacts
      uses: actions/download-artifact@v4
      with:
        name: rsbuild-config-dist
        path: packages/rsbuild-config/dist
    - name: Download i18n dist
      uses: actions/download-artifact@v4
      with:
        name: i18n-dist
        path: packages/i18n/dist
    - name: Build static service
      run: pnpm --filter @ermnvldmr/static build
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: static-dist
        path: services/static/dist/
        retention-days: 30
  deploy-s3:
    name: Deploy - S3
    needs:
    - lint-static
    - typecheck-static
    - build-static
    runs-on: apex-debian13
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: static-dist
        path: services/static/dist/
    - name: Deploy to S3
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.STATIC_AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.STATIC_AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.STATIC_AWS_REGION }}
        S3_BUCKET: ${{ secrets.STATIC_S3_BUCKET }}
        AWS_REGION: ${{ secrets.STATIC_AWS_REGION }}
        S3_ENDPOINT_URL: ${{ secrets.STATIC_S3_ENDPOINT_URL }}
      run: 'chmod +x ci/scripts/deploy-static.sh

        ./ci/scripts/deploy-static.sh

        '
