name: services/www - manual release
'on':
  workflow_dispatch:
    inputs:
      tested_sha:
        description: Full tested source commit (leave blank for latest)
        required: false
        type: string
        default: ''
      tested_digest:
        description: OCI sha256 digest (leave blank for latest)
        required: false
        type: string
        default: ''
      build_run_id:
        description: Successful WWW build run ID (leave blank for latest)
        required: false
        type: string
        default: ''
permissions:
  contents: write
  packages: write
  actions: read
jobs:
  release:
    name: Release - Tag and Promote
    runs-on: apex-debian13
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/next' && github.actor == 'deytenit'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Authenticate local registry
      run: python3 ci/scripts/docker.py login
      env:
        REGISTRY: git.ermnvldmr.com
        REGISTRY_USER: ${{ github.repository_owner }}
        REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
    - name: Verify successful build and immutable digest
      id: provenance
      run: python3 ci/scripts/provenance.py
      env:
        TESTED_SHA: ${{ inputs.tested_sha }}
        TESTED_DIGEST: ${{ inputs.tested_digest }}
        BUILD_RUN_ID: ${{ inputs.build_run_id }}
        PROVENANCE_TOKEN: ${{ github.token }}
    - name: Promote tested digest and create release tag
      env:
        TESTED_SHA: ${{ steps.provenance.outputs.tested_sha }}
        TESTED_DIGEST: ${{ steps.provenance.outputs.tested_digest }}
        BUILD_RUN_ID: ${{ steps.provenance.outputs.build_run_id }}
        PROVENANCE_TOKEN: ${{ github.token }}
        GIT_WRITE_KEY: ${{ secrets.UNIVERSAL_DEPLOY_KEY }}
      run: |
        set -euo pipefail

        VERSION=$(bash ci/scripts/calver-release.sh www)
        TAG_NAME="services/www-$VERSION"

        echo "Tagging Git commit $TESTED_SHA with $TAG_NAME..."
        bash ci/scripts/calver-release.sh tag www "$TESTED_SHA" "$VERSION"

        echo "Promoting Docker image to $VERSION and latest..."
        docker buildx imagetools create --prefer-index=false \
          "git.ermnvldmr.com/${{ github.repository }}/www@$TESTED_DIGEST" \
          --tag "git.ermnvldmr.com/${{ github.repository }}/www:$VERSION" \
          --tag "git.ermnvldmr.com/${{ github.repository }}/www:latest"

        test "$(docker buildx imagetools inspect "git.ermnvldmr.com/${{ github.repository }}/www:$VERSION" --format '{{.Manifest.Digest}}')" = "$TESTED_DIGEST"

        export VERSION TAG_NAME
        mkdir -p .ci
        python3 - <<'RELEASE_PROVENANCE'
        import json, os
        from pathlib import Path

        Path('.ci/www-release.json').write_text(json.dumps({
            'sha': os.environ['TESTED_SHA'],
            'digest': os.environ['TESTED_DIGEST'],
            'run_id': os.environ['BUILD_RUN_ID'],
            'repository': os.environ['GITHUB_REPOSITORY'],
            'release_tag': os.environ['TAG_NAME'],
            'version': os.environ['VERSION']
        }))
        RELEASE_PROVENANCE
    - uses: actions/upload-artifact@v4
      with:
        name: www-release-provenance
        path: .ci/www-release.json
        retention-days: 30
