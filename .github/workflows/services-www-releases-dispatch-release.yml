name: services/www - releases/dispatch-release

on:
  workflow_dispatch:

jobs:
  setup-stage:
    name: Setup - Stage
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-pnpm-store.outputs.cache-hit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Cache pnpm store
        id: cache-pnpm-store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  build-configs:
    name: Build - Configs
    needs: setup-stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Jest config
        run: pnpm --filter @ermnvldmr/jest-config build
      - name: Build Vite config
        run: pnpm --filter @ermnvldmr/vite-config build
      - name: Build Storybook config
        run: pnpm --filter @ermnvldmr/storybook-config build
      - name: Upload Config Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: config-artifacts
          path: |
            packages/jest-config/dist
            packages/vite-config/dist
            packages/storybook-config/dist
          retention-days: 1

  lint-www:
    name: Lint - WWW & Deps
    needs: build-configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Config Artifacts
        uses: actions/download-artifact@v4
        with:
          name: config-artifacts
          path: packages
      - name: Lint STL package
        run: pnpm --filter @ermnvldmr/stl lint
      - name: Lint UI package
        run: pnpm --filter @ermnvldmr/ui lint
      - name: Generate Astro types
        run: pnpm --filter @ermnvldmr/www astro sync
      - name: Lint WWW service
        run: pnpm --filter @ermnvldmr/www lint

  typecheck-www:
    name: Typecheck - WWW & Deps
    needs: build-configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Config Artifacts
        uses: actions/download-artifact@v4
        with:
          name: config-artifacts
          path: packages
      - name: Typecheck STL package
        run: pnpm --filter @ermnvldmr/stl typecheck
      - name: Typecheck UI package
        run: pnpm --filter @ermnvldmr/ui typecheck
      - name: Generate Astro types
        run: pnpm --filter @ermnvldmr/www astro sync
      - name: Typecheck WWW service
        run: pnpm --filter @ermnvldmr/www typecheck

  build-storybook:
    name: Build - Storybook
    needs: build-configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Config Artifacts
        uses: actions/download-artifact@v4
        with:
          name: config-artifacts
          path: packages
      - name: Build WWW Storybook
        run: pnpm --filter @ermnvldmr/www build-storybook
      - name: Upload Storybook build
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: services/www/storybook-static/
          retention-days: 1

  test-www:
    name: Test - Unit
    needs: build-configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Config Artifacts
        uses: actions/download-artifact@v4
        with:
          name: config-artifacts
          path: packages
      - name: Test STL package
        run: pnpm --filter @ermnvldmr/stl test:coverage
      - name: Test UI package
        run: pnpm --filter @ermnvldmr/ui test:coverage
      - name: Generate Astro types
        run: pnpm --filter @ermnvldmr/www astro sync
      - name: Test WWW service
        run: pnpm --filter @ermnvldmr/www test:coverage

  test-storybook:
    name: Test - Storybook
    needs: build-storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Config Artifacts
        uses: actions/download-artifact@v4
        with:
          name: config-artifacts
          path: packages
      - name: Install Playwright browsers
        run: pnpm --filter @ermnvldmr/www exec playwright install --with-deps chromium
      - name: Download Storybook build
        uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: services/www/storybook-static/
      - name: Serve Storybook and run tests
        run: pnpm --filter @ermnvldmr/www test:storybook:ci

  build-www:
    name: Build - WWW Service
    needs: build-configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download Config Artifacts
        uses: actions/download-artifact@v4
        with:
          name: config-artifacts
          path: packages
      - name: Build WWW service
        run: pnpm --filter @ermnvldmr/www build

  release-tag-docker:
    name: Release - Tag & Docker
    needs: [lint-www, typecheck-www, test-www, test-storybook, build-www]
    runs-on: ubuntu-latest
    environment: services-www-releases-publish
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate Release Version
        id: version
        run: |
          RELEASE_VERSION=$(bash ci/scripts/semantic-release.sh release ${{ github.ref_name }})
          # Extract MAJOR.MINOR for tagging
          MAJOR_MINOR=$(echo "${{ github.ref_name }}" | cut -d/ -f3 | sed 's/^v//')
          MAJOR=$(echo "$MAJOR_MINOR" | cut -d. -f1)
          echo "version=$RELEASE_VERSION" >> $GITHUB_OUTPUT
          echo "major_minor=$MAJOR_MINOR" >> $GITHUB_OUTPUT
          echo "major=$MAJOR" >> $GITHUB_OUTPUT

      - name: Create and Push Tag
        run: |
          TAG_NAME="releases/www/v${{ steps.version.outputs.version }}"
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/www
          tags: |
            type=raw,value=v${{ steps.version.outputs.version }}
            type=raw,value=v${{ steps.version.outputs.major_minor }}
            type=raw,value=v${{ steps.version.outputs.major }}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ci/docker/www/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy - VPS
    needs: release-tag-docker
    runs-on: ubuntu-latest
    environment: 
      name: services-www-releases-deploy
      url: https://ermnvldmr.com
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_VPS_HOST }}
          username: ${{ secrets.DEPLOY_VPS_USER }}
          key: ${{ secrets.DEPLOY_VPS_SSH_KEY }}
          port: ${{ secrets.DEPLOY_VPS_SSH_PORT || 22 }}
          script: |
            cd /srv/ermnvldmr.com
            git pull
            chmod +x ci/scripts/deploy-new-tags.sh
            # Use the short SHA to match the tag from release-tag-docker
            export WWW_TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
            ./ci/scripts/deploy-new-tags.sh