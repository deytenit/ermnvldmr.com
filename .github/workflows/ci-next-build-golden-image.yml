name: ci - next/build-golden-image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Golden Image Tag / Version'
        required: true
        default: 'v1.0.0'

concurrency:
  group: ci-golden-image
  cancel-in-progress: false

jobs:
  build-packer-image:
    name: Build & Upload Golden Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install QEMU and Packer
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils ovmf
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
          sudo apt-get update && sudo apt-get install -y packer

      - name: Initialize Packer plugins
        run: packer init ci/packer/debian-12-k3s.pkr.hcl

      - name: Validate Packer template
        run: packer validate ci/packer/debian-12-k3s.pkr.hcl

      - name: Build QEMU Golden Image
        run: packer build ci/packer/debian-12-k3s.pkr.hcl

      - name: Upload Golden Image to Static S3 (/dev/images/)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.COM_ERMNVLDMR_STATIC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.COM_ERMNVLDMR_STATIC_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.COM_ERMNVLDMR_STATIC_S3_REGION }}
          S3_ENDPOINT: ${{ secrets.COM_ERMNVLDMR_STATIC_S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ secrets.COM_ERMNVLDMR_STATIC_S3_BUCKET }}
        run: |
          IMAGE_NAME="com-ermnvldmr-debian-12-k3s-amd64-${{ github.event.inputs.image_tag }}.qcow2"
          mv output-qemu/debian-12-k3s-golden.qcow2 "output-qemu/${IMAGE_NAME}"
          aws --endpoint-url="${S3_ENDPOINT}" s3 cp "output-qemu/${IMAGE_NAME}" "s3://${S3_BUCKET}/dev/images/${IMAGE_NAME}"
          echo "Golden image uploaded to s3://${S3_BUCKET}/dev/images/${IMAGE_NAME}"
