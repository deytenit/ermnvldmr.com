name: ci - next/build-golden-image

on:
  workflow_dispatch:

concurrency:
  group: ci-golden-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-scripts:
    name: Validate - Provisioner Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Shell Script Syntax
        run: bash -n ci/packer/scripts/*.sh

  build-image:
    name: Build - Golden Image
    needs: validate-scripts
    runs-on: ubuntu-latest
    outputs:
      image_name: ${{ steps.vars.outputs.image_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate Image Name
        id: vars
        run: |
          SHORT_SHA="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          IMAGE_NAME="com-ermnvldmr-debian-12-k3s-amd64-${SHORT_SHA}.qcow2"
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install Image Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libguestfs-tools qemu-utils linux-image-generic
          sudo chmod 644 /boot/vmlinuz* 2>/dev/null || true

      - name: Build Debian K3s Golden Image
        run: |
          export LIBGUESTFS_BACKEND=direct
          mkdir -p output-qemu
          echo "Downloading official Debian 12 cloud image..."
          curl -fsSL -o base.qcow2 https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2
          
          echo "Expanding disk image to 10G..."
          qemu-img resize base.qcow2 10G
          
          echo "Running provisioner scripts inside disk image..."
          virt-customize -a base.qcow2 \
            --run ci/packer/scripts/01-base-system.sh \
            --run ci/packer/scripts/02-install-k3s.sh \
            --run ci/packer/scripts/03-cleanup.sh
          
          echo "Compressing and optimizing qcow2 with 2M cluster size..."
          qemu-img convert -f qcow2 -O qcow2 -o cluster_size=2M -c base.qcow2 output-qemu/com-ermnvldmr-debian-12-k3s-amd64.qcow2
          echo "Golden image built successfully."

      - name: Prepare and Upload Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: golden-image
          path: output-qemu/com-ermnvldmr-debian-12-k3s-amd64.qcow2
          retention-days: 1

  upload-s3:
    name: Upload - S3 Storage
    needs: build-image
    runs-on: ubuntu-latest
    steps:
      - name: Download Image Artifact
        uses: actions/download-artifact@v4
        with:
          name: golden-image
          path: output-qemu

      - name: Upload to Static S3 (/dev/images/)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.COM_ERMNVLDMR_STATIC_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.COM_ERMNVLDMR_STATIC_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.COM_ERMNVLDMR_STATIC_S3_REGION }}
          S3_ENDPOINT: ${{ secrets.COM_ERMNVLDMR_STATIC_S3_ENDPOINT_URL }}
          S3_BUCKET: ${{ secrets.COM_ERMNVLDMR_STATIC_S3_BUCKET }}
          IMAGE_NAME: ${{ needs.build-image.outputs.image_name }}
        run: |
          mv output-qemu/com-ermnvldmr-debian-12-k3s-amd64.qcow2 "output-qemu/${IMAGE_NAME}"
          aws --endpoint-url="${S3_ENDPOINT}" s3 cp "output-qemu/${IMAGE_NAME}" "s3://${S3_BUCKET}/dev/images/${IMAGE_NAME}"
          echo "Golden image uploaded to s3://${S3_BUCKET}/dev/images/${IMAGE_NAME}"
