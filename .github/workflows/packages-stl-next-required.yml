name: packages/stl - next/required

on:
  push:
    branches: [next]
    paths: 
      - 'packages/stl/**'
      - 'pnpm-lock.yaml'

concurrency:
  group: ci-stl-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup stage
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache-pnpm-store.outputs.cache-hit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3

      - name: Setup Node.js with pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Cache pnpm store
        id: cache-pnpm-store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  lint:
    name: Lint STL
    needs: [setup, build-configs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint STL package
        run: pnpm --filter @ermnvldmr/stl lint

  type-check:
    name: Typecheck STL
    needs: [setup, build-configs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck STL package
        run: pnpm --filter @ermnvldmr/stl typecheck

  build-configs:
    name: Build Config Packages
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Jest config
        run: pnpm --filter @ermnvldmr/jest-config build
      - name: Build Vite config
        run: pnpm --filter @ermnvldmr/vite-config build

  test:
    name: Test STL
    needs: [setup, build-configs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Jest config
        run: pnpm --filter @ermnvldmr/jest-config build
      - name: Build Vite config
        run: pnpm --filter @ermnvldmr/vite-config build
      - name: Test STL package
        run: pnpm --filter @ermnvldmr/stl test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./packages/stl/coverage/lcov.info
          flags: stl
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Build STL Package
    needs: [setup, build-configs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.3
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Jest config
        run: pnpm --filter @ermnvldmr/jest-config build
      - name: Build Vite config
        run: pnpm --filter @ermnvldmr/vite-config build
      - name: Build STL package
        run: pnpm --filter @ermnvldmr/stl build
