name: next/checkout-release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version (e.g. v1.2.0)'
        required: true
        default: 'v1.0.0'
      base_branch:
        description: 'Trunk branch to branch from'
        required: true
        default: 'next'

permissions:
  contents: write
  id-token: write

jobs:
  create-release-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected main branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.base_branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Create release branch
        run: |
          RELEASE="release/${{ github.event.inputs.release_version }}"
          echo "Creating branch $RELEASE off ${{ github.event.inputs.base_branch }}"
          git checkout -b "$RELEASE"
          git push -u origin "$RELEASE"

      - name: Output branch URL
        run: |
          echo "Release branch created:"
          echo "https://github.com/${{ github.repository }}/tree/release/${{ github.event.inputs.release_version }}"
