# Docker Compose for local development and testing
# Use: docker-compose up to start both services locally

version: '3.8'

services:
  # Astro static site
  astro:
    build:
      context: .
      dockerfile: docker/astro/Dockerfile
      target: production
    ports:
      - "3000:8080"
    container_name: www-ermnvldmr-astro
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Storybook component library
  storybook:
    build:
      context: .
      dockerfile: docker/storybook/Dockerfile
      target: production
    ports:
      - "6006:8080"
    container_name: www-ermnvldmr-storybook
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Optional: Add a reverse proxy for unified access
  # nginx-proxy:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./docker/nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
