# Docker Compose for local development and testing
# Use: docker-compose up to start services locally

version: '3.8'

services:
  # WWW service (Astro static site)
  www:
    build:
      context: .
      dockerfile: docker/astro/Dockerfile
      target: production
    ports:
      - "3000:8080"
    container_name: ermnvldmr-www
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # WWW Storybook
  www-storybook:
    build:
      context: .
      dockerfile: docker/storybook/Dockerfile
      target: production
    ports:
      - "6006:8080"
    container_name: ermnvldmr-www-storybook
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Docs service (Hugo static site) - Future implementation
  # docs:
  #   build:
  #     context: .
  #     dockerfile: docker/hugo/Dockerfile
  #     target: production
  #   ports:
  #     - "3001:8080"
  #   container_name: ermnvldmr-docs
  #   environment:
  #     - NODE_ENV=production
  #   restart: unless-stopped

# Optional: Add a reverse proxy for unified access
